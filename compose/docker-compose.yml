name: dbfox

services:
  server:
    image: ghcr.io/richardgvin/dbfox-server:${DBFOX_VERSION:?Use the release Compose bundle}@${DBFOX_SERVER_DIGEST:?Use the release Compose bundle}
    platform: linux/amd64
    environment:
      DBFOX_ADDR: "0.0.0.0:${DBFOX_SERVER_PORT:-7788}"
    ports:
      - "127.0.0.1:${DBFOX_SERVER_PORT:-7788}:${DBFOX_SERVER_PORT:-7788}"
    volumes:
      - dbfox-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${DBFOX_SERVER_PORT:-7788}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    image: ghcr.io/richardgvin/dbfox-web:${DBFOX_VERSION:?Use the release Compose bundle}@${DBFOX_WEB_DIGEST:?Use the release Compose bundle}
    platform: linux/amd64
    depends_on:
      server:
        condition: service_healthy
    environment:
      DBFOX_SERVER_PORT: "${DBFOX_SERVER_PORT:-7788}"
    ports:
      - "127.0.0.1:${DBFOX_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  dbfox-data:
